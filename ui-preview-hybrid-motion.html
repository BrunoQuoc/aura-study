<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA STUDY · Hybrid Motion Preview</title><style>html,body{margin:0;width:100%;height:100%;background:#0b1730}iframe{display:block;width:100%;height:100%;border:0;background:#0b1730}</style></head><body><iframe id="auraPreview" src="ui-preview-hybrid.html?v=hybrid-r2" title="AURA STUDY Hybrid Motion Preview"></iframe><script>(function(){const frame=document.getElementById('auraPreview');frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const css=d.createElement('link');css.rel='stylesheet';css.href='ui-preview-card-motion.css?v=card-motion-r1';d.head.appendChild(css);const bind=()=>{d.querySelectorAll('.stat,.lesson-card,.exam,.resource').forEach(el=>{if(el.dataset.auraTouchBound)return;el.dataset.auraTouchBound='1';el.classList.add('aura-touch-card');const pulse=()=>{el.classList.remove('touch-pulse');void el.offsetWidth;el.classList.add('touch-pulse');setTimeout(()=>el.classList.remove('touch-pulse'),520)};el.addEventListener('pointerdown',()=>el.classList.add('is-pressed'));['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('is-pressed')));el.addEventListener('click',pulse)});};bind();new MutationObserver(bind).observe(d.body,{childList:true,subtree:true})})})();</script></body></html>
