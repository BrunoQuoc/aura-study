<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AURA STUDY">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>AURA STUDY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system;background:#f5f7fb;color:#172033}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;z-index:5}
b.logo{color:#2457e6;font-size:20px}small.ver{font-size:11px;background:#eef2ff;padding:3px 6px;border-radius:999px}
main{max-width:980px;margin:auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(135deg,#173baf,#386af3);color:#fff;padding:22px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#2457e6;color:#fff}button.ghost{background:#eef2ff;color:#243b84}
input,textarea{width:100%;padding:11px;border:1px solid #d8dfeb;border-radius:10px;font:inherit}textarea{min-height:110px}
.muted{color:#6b7280}.q{margin:10px 0}.good{color:#15803d}.bad{color:#b91c1c}.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#243b84}
.install{margin-top:14px;background:#fff;border:1px solid #dbe4ff;border-radius:16px;padding:16px}.install ol{padding-left:20px;margin:8px 0}.offline{background:#fff7ed;color:#9a3412}.online{background:#ecfdf5;color:#166534}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:transparent;color:#334155;border-radius:0;padding:12px 4px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}nav{position:static;max-width:980px;margin:auto;border:0;background:transparent;padding:8px 16px}}
</style></head><body>
<header><b class="logo">AURA STUDY <small class="ver">V2.1.1</small></b><div><span id="net" class="pill">● Online</span> <button class="ghost" onclick="backup()">Sao lưu</button></div></header>
<main id="app"></main>
<nav><button onclick="home()">⌂ Trang chủ</button><button onclick="library()">▦ Thư viện</button><button onclick="history()">◷ Kết quả</button></nav>
<script>
const subjects=[['TOAN','Toán','∑'],['NGUVAN','Ngữ văn','文'],['TIENGANH','Tiếng Anh','EN'],['KHTN','KHTN','⚗'],['LSDL','Lịch sử & Địa lý','◎'],['GDCD','GDCD','⚖'],['TINHOC','Tin học','⌘'],['CONGNGHE','Công nghệ','⚙']];
const Q=[["M={1;3;5;7;9}. Số nào không thuộc M?","6"],["Các số tự nhiên >4 và ≤8?","5;6;7;8"],["Trong 72 456, chữ số 2 thuộc hàng nào?","nghìn"],["XXIV bằng bao nhiêu?","24"],["Số nhỏ nhất: 6215, 6125, 6251, 6152","6125"],["Số liền trước 2000?","1999"],["Ước của 48 trong 5,7,8,9?","8"],["Nếu a chia hết cho 7 thì a+14 chia hết cho?","7"],["Số chia hết cho 9: 423, 425, 427, 429","423"],["Số chia hết cho cả 2 và 5: 340, 342, 345, 348","340"],["Số nguyên tố trong 21,27,37,39","37"],["Số không phải số nguyên tố trong 11,13,17,21","21"],["245+155= ?","400"],["720−385= ?","335"],["36×25= ?","900"],["864:24= ?","36"],["8×8×8 viết dạng lũy thừa","8^3"],["Cơ số của 6^4","6"],["3^3−2^3","19"],["1 000 000 = 10^?","6"],["Có bao nhiêu số nguyên tố lớn hơn 10 và nhỏ hơn 20?","4"],["Số nguyên tố nhỏ nhất có 2 chữ số","11"],["8°C dưới 0 viết là","-8"],["Trong -12,5,-3,0,-8,7 có bao nhiêu số dương?","2"],["936−457+264","743"],["250−2^4×5+180:9","190"],["Số nhỏ nhất chia hết cho 15 và 24","120"],["Buổi sáng -6°C, tăng 11°C. Nhiệt độ mới?","5"]];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function installCard(){if(standalone())return '';return `<div class="install"><b>📲 Cài AURA STUDY lên iPad/iPhone</b><ol><li>Mở trang này bằng Safari.</li><li>Bấm nút Chia sẻ.</li><li>Chọn <b>Thêm vào Màn hình chính</b>.</li><li>Bấm <b>Thêm</b>.</li></ol><div class="muted">Sau khi cài, AURA STUDY mở như một app riêng và vẫn dùng được với nội dung đã lưu cache.</div></div>`}
function net(){let e=$('#net');if(!e)return;e.textContent=navigator.onLine?'● Online':'● Offline';e.className='pill '+(navigator.onLine?'online':'offline')}
addEventListener('online',net);addEventListener('offline',net);
function home(){let a=JSON.parse(localStorage.getItem('aura_attempts')||'[]');$('#app').innerHTML=`<section class="hero"><h1>Kho học tập lớp 6</h1><p>Học • luyện đề • lưu kết quả trên iPad/mobile</p></section>${installCard()}<div class="grid"><div class="card"><b>${subjects.length}</b><div class="muted">Môn học</div></div><div class="card"><b>3</b><div class="muted">Môn có dữ liệu</div></div><div class="card"><b>${a.length}</b><div class="muted">Lần làm bài</div></div><div class="card"><b>${a.length?(a.reduce((x,y)=>x+y.score,0)/a.length).toFixed(1):'—'}</b><div class="muted">Điểm TB</div></div></div><h2>Môn học</h2><div class="grid">${subjects.map(s=>`<div class="card" onclick="subject('${s[0]}')"><h3>${s[2]} ${s[1]}</h3><div class="muted">${['TOAN','NGUVAN','TIENGANH'].includes(s[0])?'Đã có nội dung':'Chưa có nội dung'}</div></div>`).join('')}</div>`;net()}
function library(){home()}
function subject(id){let body='';if(id==='TOAN')body=`<div class="card"><h2>Toán 6</h2><p>GK1 – Đề số 2 • 28 câu</p><button onclick="quiz()">Bắt đầu làm bài</button></div>`;else if(id==='NGUVAN')body=`<div class="card"><h2>Ngữ văn 6</h2><h3>Thực hành Tiếng Việt HKI</h3><p>Từ đơn – từ phức, nghĩa của từ, so sánh, nhân hóa, điệp ngữ.</p><textarea data-k="nvnote" placeholder="Ghi chú của bé..."></textarea></div><div class="card"><h3>Bộ đề đọc hiểu</h3><p>5 đề: Sức sống của rừng • Hạt mầm ước mơ • Vẻ đẹp Mù Cang Chải • Khát vọng hòa bình • Biển trời quê hương.</p></div><div class="card"><h3>Nghị luận xã hội theo chủ đề</h3><p>Hòa bình • Văn hóa hội nhập • Vô cảm • Lạc quan • Gia đình • Lòng yêu nước...</p></div>`;else if(id==='TIENGANH')body=`<div class="card"><h2>Tiếng Anh 6</h2><h3>Review Unit 1–3 • Global Success 6</h3><p>Guided cloze • Reading • True/False • Sentence rewriting.</p><textarea data-k="ennote" placeholder="Ghi chú / câu trả lời..."></textarea></div>`;else body=`<div class="card"><h2>${subjects.find(x=>x[0]===id)[1]}</h2><p class="muted">Chưa có nội dung. Hãy đưa tài liệu vào Google Drive 00_INBOX và yêu cầu Nova chuẩn hóa.</p></div>`;$('#app').innerHTML=body;document.querySelectorAll('[data-k]').forEach(e=>{e.value=localStorage.getItem(e.dataset.k)||'';e.oninput=()=>localStorage.setItem(e.dataset.k,e.value)})}
function norm(s){return String(s).toLowerCase().trim().replace(/\s+/g,'').replace(/−/g,'-')}
function quiz(){$('#app').innerHTML=`<div class="card"><h2>Toán 6 – GK1 Đề số 2</h2><p class="muted">Nhập đáp án ngắn gọn. Bài tự lưu trên thiết bị.</p></div>`+Q.map((x,i)=>`<div class="card q"><b>Câu ${i+1}. ${esc(x[0])}</b><input id="q${i}" placeholder="Đáp án" oninput="saveQ()"></div>`).join('')+`<button onclick="submitQ()">Nộp bài & chấm điểm</button>`;let s=JSON.parse(localStorage.getItem('aura_math_draft')||'[]');s.forEach((v,i)=>{if($('#q'+i))$('#q'+i).value=v})}
function saveQ(){localStorage.setItem('aura_math_draft',JSON.stringify(Q.map((_,i)=>$('#q'+i)?.value||'')))}
function submitQ(){let a=Q.map((_,i)=>$('#q'+i)?.value||''),ok=0;Q.forEach((x,i)=>{if(norm(a[i])===norm(x[1]))ok++});let score=+(ok/Q.length*10).toFixed(1),list=JSON.parse(localStorage.getItem('aura_attempts')||'[]');list.unshift({title:'Toán 6 GK1 – Đề số 2',score,ok,total:Q.length,time:new Date().toISOString()});localStorage.setItem('aura_attempts',JSON.stringify(list));localStorage.removeItem('aura_math_draft');$('#app').innerHTML=`<div class="card"><h1 class="${score>=5?'good':'bad'}">${score}/10</h1><p>Đúng ${ok}/${Q.length} câu.</p><button onclick="quiz()">Làm lại</button></div>`+Q.map((x,i)=>norm(a[i])===norm(x[1])?'':`<div class="card"><b class="bad">Câu ${i+1} cần sửa</b><p>${esc(x[0])}</p><p><b>Đáp án:</b> ${esc(x[1])}</p></div>`).join('')}
function history(){let a=JSON.parse(localStorage.getItem('aura_attempts')||'[]');$('#app').innerHTML=`<h2>Kết quả</h2>`+(a.length?a.map(x=>`<div class="card"><b>${x.title}</b><h3>${x.score}/10</h3><div class="muted">${new Date(x.time).toLocaleString('vi-VN')}</div></div>`).join(''):`<div class="card muted">Chưa có kết quả.</div>`)}
function backup(){let d={version:'2.1.1',attempts:JSON.parse(localStorage.getItem('aura_attempts')||'[]'),nvnote:localStorage.getItem('nvnote')||'',ennote:localStorage.getItem('ennote')||''},b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AURA_STUDY_BACKUP_V2_1_1.json';a.click()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});home();
</script></body></html>
