  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node.js
        run: node --version
      - name: Run private document sync tests
        run: node --test tests/legacy-private-assets-v2.test.mjs tests/sgk-auto-review-policy.test.mjs tests/admin-unified-v3.test.mjs tests/learning-pipeline-v4.test.mjs tests/student-single-login-v5.test.mjs tests/student-password-v6.test.mjs
