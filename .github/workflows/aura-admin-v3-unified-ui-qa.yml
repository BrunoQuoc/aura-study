name: AURA STUDY - Admin V3 Unified UI QA
on:
  push:
    branches:
      - feat/admin-v3-three-content-lanes-20261118
    paths:
      - 'admin-direct.html'
      - 'admin_unified_v3.js'
      - 'admin_unified_v3.css'
      - 'tests/admin-unified-v3-browser.mjs'
      - '.github/workflows/aura-admin-v3-unified-ui-qa.yml'
  pull_request:
    paths:
      - 'admin-direct.html'
      - 'admin_unified_v3.js'
      - 'admin_unified_v3.css'
      - 'tests/admin-unified-v3-browser.mjs'
      - '.github/workflows/aura-admin-v3-unified-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-v3-browser:
    name: Admin V3 phone / iPad / desktop (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium for compatible Ubuntu 24.04
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser against local source with mocked server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aura-admin-v3-http.log 2>&1 &
          sleep 2
          node tests/admin-unified-v3-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-admin-v3-ui-screenshots
          path: test-results/admin-unified-v3/
          retention-days: 7
