name: AURA STUDY - Student V5 Single Login Browser QA
on:
  push:
    branches:
      - feat/student-single-login-navigation-v5-20261118
    paths:
      - 'student-direct.html'
      - 'admin-direct.html'
      - 'student_cloud_access_v5.js'
      - 'student_cloud_access_v5.css'
      - 'student_learning_navigation_v5.js'
      - 'student_learning_navigation_v5.css'
      - 'admin_cloud_students_v5.js'
      - 'aura-simple-access.js'
      - 'aura-student.html'
      - 'tests/student-single-login-v5-browser.mjs'
      - '.github/workflows/aura-student-v5-single-login-qa.yml'
  pull_request:
    paths:
      - 'student-direct.html'
      - 'admin-direct.html'
      - 'student_cloud_access_v5.js'
      - 'student_learning_navigation_v5.js'
      - 'admin_cloud_students_v5.js'
      - 'aura-simple-access.js'
      - 'aura-student.html'
      - 'tests/student-single-login-v5-browser.mjs'
      - '.github/workflows/aura-student-v5-single-login-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-v5-smoke:
    name: Student cloud-only + Admin users across phone iPad desktop (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and use installed Chrome
        run: |
          npm install --no-save playwright@1.56.1
          google-chrome --version
      - name: Test legacy Student with a single verified cloud account
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aura-student-v5-http.log 2>&1 &
          sleep 2
          node tests/student-single-login-v5-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-student-v5-login-and-nav
          path: test-results/student-v5/
          retention-days: 7
