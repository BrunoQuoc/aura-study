name: AURA Math6 Volume2 + Year-End Formative & iPad QA

on:
  pull_request:
    paths:
      - 'aura_data/knowledge_math6_kntt_volume2_v1.json'
      - 'knowledge-math6-volume2.html'
      - 'knowledge_math6_volume2.js'
      - 'aura_data/knowledge_math6_kntt_volume2_chapter7_review_v1.json'
      - 'knowledge-math6-decimals-review.html'
      - 'knowledge_math6_decimals.js'
      - 'aura_data/knowledge_math6_kntt_volume2_chapter8_review_v1.json'
      - 'knowledge-math6-geometry-review.html'
      - 'knowledge_math6_geometry_review.js'
      - 'knowledge_math6_geometry_svg.js'
      - 'knowledge_math6_geometry.css'
      - 'aura_data/knowledge_math6_kntt_volume2_chapter9_review_v1.json'
      - 'knowledge-math6-statistics-review.html'
      - 'knowledge_math6_statistics.js'
      - 'aura_data/knowledge_math6_kntt_volume2_chapter6_review_v1.json'
      - 'aura_data/math6_endyear_practice_v1.json'
      - 'knowledge-math6-fractions-review.html'
      - 'knowledge-math6-yearend.html'
      - 'knowledge_math6_extra_chapter_review.js'
      - 'knowledge_math6_yearend.js'
      - 'knowledge_math6_statistics.css'
      - 'tests/knowledge-math6-yearend-bridge.test.mjs'
      - 'tests/knowledge-math6-yearend-bridge-browser.mjs'
      - 'docs/math6-progress-report-full-draft-20261113.md'
      - 'tests/knowledge-math6-chapter9-statistics.test.mjs'
      - 'tests/knowledge-math6-chapter9-browser.mjs'
      - 'tests/knowledge-math6-chapter8-geometry.test.mjs'
      - 'tests/knowledge-math6-chapter8-browser.mjs'
      - 'knowledge_math6_decimals.css'
      - 'tests/knowledge-math6-chapter7-decimals.test.mjs'
      - 'tests/knowledge-math6-chapter7-browser.mjs'
      - 'lesson_maps_ui.js'
      - 'student-direct.html'
      - 'tests/knowledge-math6-volume2-fractions.test.mjs'
      - 'tests/knowledge-math6-volume2-browser.mjs'
      - '.github/workflows/aura-math6-volume2-fractions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-content:
    name: 21 authored lessons VI–IX, 63 lesson + 18 chapter-review answers
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fraction source, safety gates and legacy Volume 1
        run: |
          node --check knowledge_math6_volume2.js
          node --check knowledge_math6_decimals.js
          node --check knowledge_math6_geometry_svg.js
          node --check knowledge_math6_geometry_review.js
          node --check knowledge_math6_statistics.js
          node --check knowledge_math6_extra_chapter_review.js
          node --check knowledge_math6_yearend.js
          node --check lesson_maps_ui.js
          node --test tests/knowledge-math6-volume2-fractions.test.mjs \
                      tests/knowledge-math6-chapter7-decimals.test.mjs \
                      tests/knowledge-math6-chapter8-geometry.test.mjs \
                      tests/knowledge-math6-chapter9-statistics.test.mjs \
                      tests/knowledge-math6-yearend-bridge.test.mjs \
                      tests/knowledge-math6-volume1-v2.test.mjs \
                      tests/knowledge-math6-chapter-review.test.mjs

  chromium:
    name: iPad / Phone / Desktop fraction reader and Volume 1 regression
    needs: static-content
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and system packages
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise original chapter and existing Volume 1 independently
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aura-math6-volume2-http.log 2>&1 &
          sleep 2
          node tests/knowledge-math6-volume2-browser.mjs
          node tests/knowledge-math6-chapter7-browser.mjs
          node tests/knowledge-math6-chapter8-browser.mjs
          node tests/knowledge-math6-chapter9-browser.mjs
          node tests/knowledge-math6-yearend-bridge-browser.mjs
          node tests/knowledge-math6-volume1-browser.mjs
          node tests/knowledge-math6-chapter-review-browser.mjs
      - name: Keep synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-math6-volume2-fractions-preview
          path: |
            test-results/knowledge-math6-volume2/
            test-results/knowledge-math6-chapter7-decimals/
            test-results/knowledge-math6-chapter8-geometry/
            test-results/knowledge-math6-chapter9/
            test-results/math6-yearend-bridge/
            test-results/knowledge-math6-volume1/
            test-results/knowledge-math6-chapter-review/
          retention-days: 7

# No teacher signoff, protected key, official Exam Engine or Question Bank writes.
