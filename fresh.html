<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b3a"><title>AURA STUDY · Fresh Start</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fb;color:#172039}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid #e7eaf1;border-radius:24px;padding:26px;box-shadow:0 24px 60px rgba(22,30,55,.12);text-align:center}.logo{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#111b3a,#5267d9);color:#fff;font-weight:900}.card h1{font-size:22px;margin:0 0 8px}.card p{color:#6f788b;line-height:1.55;margin:0 0 18px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#5367e8;color:#fff;font-weight:900;cursor:pointer}.status{font-size:12px;color:#7a8395;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><div class="logo">A</div><h1>AURA STUDY</h1><p>Đang làm mới dữ liệu trình duyệt và mở phiên bản mới nhất.</p><button class="btn" id="go">Mở AURA STUDY</button><div class="status" id="status">Sẵn sàng</div></div></div><script>(function(){async function fresh(){var s=document.getElementById('status');s.textContent='Đang làm mới…';try{if('serviceWorker'in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister()}))}if('caches'in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}}catch(e){}location.replace('./index.html?fresh='+Date.now())}document.getElementById('go').onclick=fresh;setTimeout(fresh,800)})();</script></body></html>
